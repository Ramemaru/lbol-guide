      - { label: 考察の確信度, name: status, widget: string, default: 検討中 }
      - { label: 対象ゲームバージョン, name: version, widget: string, required: false }
      - { label: 最終確認日, name: updated, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, required: false }
      - label: タグ
        name: tags
        widget: list
        required: false
        default: []
        field: { label: タグ, name: tag, widget: string }
      - { label: 代表画像, name: image, widget: image, required: false }
      - { label: 画像の代替テキスト, name: image_alt, widget: string, required: false }
      - { label: 下書き（ONだとサイトに出ません）, name: draft, widget: boolean, default: true, required: false }
      - { label: 見本記事, name: sample, widget: boolean, default: false, required: false }
      - label: 本文
        name: body
        widget: markdown
        default: |
          ## 全体方針

          ## 序盤の考え方

          ## カードピックの判断

